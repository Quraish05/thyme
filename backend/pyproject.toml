[project]
name = "life-tracker-backend"
version = "0.1.0"
description = "FastAPI backend for Life Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "bcrypt>=5.0.0",
    "pyjwt>=2.10.0",
    # Verifies Google Sign-In ID tokens offline against Google's public certs.
    "google-auth>=2.35.0",
    "pywebpush>=2.0.0",
    "anthropic>=0.119.0",
    "google-genai>=2.14.0",
    "structlog>=24.1.0",
    # RAG: pgvector column type for SQLAlchemy + local, free sentence embeddings.
    "pgvector>=0.3.6",
    "sentence-transformers>=3.0.0",
    # Cron-spec parsing for the background job scheduler (app/services/jobs).
    "croniter>=3.0.0",
    # Pulled in transitively by sentence-transformers, but declared explicitly so
    # we can pin it to the CPU-only build (see [tool.uv.sources] below). Without
    # this, torch drags ~2.9GB of unused NVIDIA CUDA libraries into the Linux
    # image. There's no GPU on Render or in the kind sandbox, so CPU is correct.
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: don't fight the generator's formatting.
"alembic/versions/*" = ["E501"]
# The extraction prompt embeds few-shot JSON examples whose readability matters
# more than an 80-char limit; the example lines can't carry a noqa mid-string.
"app/services/follow_up_extraction.py" = ["E501"]
"app/services/tag_suggestion.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[[tool.uv.index]]
# PyTorch's CPU-only wheel index. `explicit = true` means uv pulls from it ONLY
# for packages that opt in via [tool.uv.sources] — everything else still
# resolves from PyPI as normal.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Route torch to the CPU index on Linux (drops ~2.9GB of NVIDIA CUDA libs from
# the image). Scoped to Linux so macOS / local dev resolution is untouched —
# macOS torch has no CUDA build anyway.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
