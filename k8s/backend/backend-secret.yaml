# Backend secrets. DATABASE_URL points at the in-cluster Postgres by its Service
# DNS name (`postgres`), using the same creds as postgres-secret. asyncpg scheme
# required (config.py would also normalize a bare postgres:// URL).
#
# LEARNING SANDBOX ONLY — see the note in database/postgres-secret.yaml. Never
# commit real secrets; SECRET_KEY here is a throwaway dev value.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: thyme
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://thyme:thyme-dev-password@postgres:5432/thyme
  SECRET_KEY: dev-sandbox-secret-not-for-production-0123456789
