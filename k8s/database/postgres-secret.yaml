# Postgres credentials. The official image reads these three env vars on first
# boot to create the superuser + database. The backend tier (Level 3) reads the
# same Secret to build its DATABASE_URL, so there's a single source of truth.
#
# LEARNING SANDBOX ONLY: plaintext creds in a committed manifest are fine here
# because this cluster is local and throwaway. In production you would NEVER
# commit a Secret — use Sealed Secrets, External Secrets Operator, or a cloud
# secret manager, and let the pod mount it at runtime.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: thyme
type: Opaque
stringData:
  POSTGRES_USER: thyme
  POSTGRES_PASSWORD: thyme-dev-password
  POSTGRES_DB: thyme
