# Frontend CI — lint + typecheck + build on every PR (and on push to master).
#
# Mirrors backend-ci.yml for the Next.js app: the safety net before Vercel
# auto-deploys. Runs only when frontend code (or this file) changes.
name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # Node 20 LTS. The npm cache keys off frontend/package-lock.json so installs
      # are fast on repeat runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci (not install): install exactly what package-lock.json pins, and fail
      # if it's out of sync — the frontend equivalent of `uv sync --frozen`.
      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # noEmit is set in tsconfig, so this only type-checks — no output files.
      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build (next build)
        run: npm run build
